[package]
name = "concup-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line driver for the Concat engine."

# `concat` is the editor window's binary; the driver gets the suffix.
[[bin]]
name = "concup-cli"
path = "src/main.rs"

[dependencies]
concup-core.workspace = true
concup-media.workspace = true
concup-render.workspace = true
# The `api` command: the Concat API over stdin and stdout. The `serve`
# command: the same on a socket.
concup-api.workspace = true
concup-server.workspace = true
serde_json.workspace = true
# `preview` draws one effect's card, as the window does; `check` loads
# packages and runs their probes.
concup-effects.workspace = true
concup-host.workspace = true
clap.workspace = true

[features]
# `serve --grpc`. Off by default; see concup-server.
grpc = ["concup-server/grpc"]

[lints]
workspace = true
